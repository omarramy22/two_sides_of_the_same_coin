<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <g filter="url(#wobble)" stroke="var(--sol-ink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- short round cloak -->
    <path d="M31 82 Q29.5 66 37 58 Q48 52.5 59 58 Q66.5 66 65 82 Q48 87.5 31 82 Z" fill="var(--sol-cloak)"/>
    <!-- tunic showing through the front opening -->
    <path d="M43 57.5 Q48 60.5 53 57.5 L51.5 84.5 Q48 85.5 44.5 84.5 Z" fill="var(--sol-tunic)" stroke-width="1.3"/>
    <!-- shade, bottom-right (light from top-left) -->
    <path d="M57.5 59.5 Q66 66 65 82 Q60.5 84.5 56.5 85 Q60.5 71 57.5 59.5 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M44.5 84.5 L44.5 70 L46 84.8 Z" fill="url(#hatch-fine)" stroke="none"/>
    <!-- gold hem, milled like a coin edge -->
    <path d="M31 80.5 Q48 86.5 65 80.5 L65 83 Q48 89 31 83 Z" fill="var(--gold)" stroke-width="1.4"/>
    <path d="M33 82.6 Q48 87.6 63 82.6" fill="none" stroke="var(--gold-dark)" stroke-width="1.1" stroke-dasharray="0.8 1.4"/>
    <!-- collar clasp -->
    <circle cx="48" cy="57.5" r="2" fill="var(--gold)" stroke-width="1.2"/>
  </g>
</svg>
