    <path d="M40.5 81 L40 86.6 Q42.5 88 44.6 86.6 L44.6 82 Z M50 82 L50 86.6 Q52.2 88 54.4 86.6 L54 81 Z" fill="var(--sleep-dark)" stroke-width="1.5"/>
