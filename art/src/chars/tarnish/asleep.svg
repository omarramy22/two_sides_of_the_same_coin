    <ellipse cx="47" cy="65.5" rx="13.2" ry="14" fill="none" stroke="var(--sleep-dark)" stroke-width="1" stroke-dasharray="2 1.6"/>
    <path d="M47 75.4 L47.9 77.4 L50 77.6 L48.4 79 L48.9 81 L47 79.9 L45.1 81 L45.6 79 L44 77.6 L46.1 77.4 Z" fill="none" stroke-width="0.8" stroke-opacity="0.7"/>
    <!-- verdigris patina blooms -->
    <path d="M33 70 Q35 66 38.5 68.5 Q39 73 35.6 74.6 Q33 73.4 33 70 Z M52.5 76.4 Q55.6 73.4 58 76 Q56.6 79.6 53.4 79.4 Z M38 54.6 Q41 53 42.4 55.6 Q40.4 58 38 57 Z" fill="var(--verdigris-dark)" fill-opacity="0.85" stroke="none"/>
