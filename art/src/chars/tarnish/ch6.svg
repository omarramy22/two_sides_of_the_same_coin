<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" data-palettes="awake,asleep">
  <!-- Chapter 6, The Rim: dulled gold-and-silver mirror coin with a cracked face and shard crown -->
  <g filter="url(#wobble)" stroke="#2A1E14" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="48" cy="88" rx="14" ry="3.6" fill="#000" fill-opacity="0.25" stroke="none"/>
    
    <!-- stubby legs -->
    <path d="M40.5 81 L40 86.6 Q42.5 88 44.6 86.6 L44.6 82 Z M50 82 L50 86.6 Q52.2 88 54.4 86.6 L54 81 Z" fill="#5C4E7A" stroke-width="1.5"/>
    <!-- coin edge -->
    <path d="M48 47.5 Q66.5 48 67.5 65.5 Q66.5 83 48 83.5 Z" fill="#5C4E7A"/>
    <path d="M57 50 L57 81 M60.6 51.8 L60.6 79.4 M63.8 55 L63.8 76.2 M66 59.6 L66 71.6" stroke="#D6CCEA" stroke-width="1" stroke-opacity="0.6"/>
    <!-- coin face -->
    <path d="M30.5 65.5 Q30.5 52 38 48.6 Q47 44.6 55.4 49.6 Q63.5 54 63.5 65.5 Q63.2 83 47 83.4 Q30.8 83 30.5 65.5 Z" fill="#A99BC4"/>
    <path d="M55.6 51 Q61.8 56 61.6 66.5 Q60.8 80 49.5 81.8 Q58 74 57.6 64 Q57.4 56.6 55.6 51 Z" fill="url(#hatch)" stroke="none"/>
    <ellipse cx="47" cy="65.5" rx="13.2" ry="14" fill="none" stroke="#5C4E7A" stroke-width="1" stroke-dasharray="2 1.6"/>
    <path d="M47 52 Q38 54 34.4 62 Q32.6 72 38 79 Q42 82.4 47 82.6 Z" fill="#C9A55A" fill-opacity="0.75" stroke="none"/>
    <path d="M47 51.6 L47 82.6 M40.6 58 L47 64 L54.6 57.6 M36 70 L47 64 L58.4 72" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.85"/>
    <!-- awake: brows, glowing eyes, jagged grin -->
    <g class="tarnish-awake">
      <path d="M37.5 57 L44.5 60 M56.5 57 L49.5 60" stroke-width="2.2"/>
      <ellipse cx="41.6" cy="63.4" rx="2.9" ry="3.3" fill="#FFFFFF" stroke-width="1.4"/>
      <ellipse cx="52.4" cy="63.4" rx="2.9" ry="3.3" fill="#FFFFFF" stroke-width="1.4"/>
      <circle cx="42.2" cy="64" r="1.2" fill="#2A1E14" stroke="none"/>
      <circle cx="51.8" cy="64" r="1.2" fill="#2A1E14" stroke="none"/>
      <path d="M41.5 72 L43.5 70.6 L45.5 72.4 L47.5 70.6 L49.5 72.4 L51.5 70.6 L53 72" fill="none" stroke-width="1.4"/>
    </g>
    <!-- asleep: closed eyes, slack mouth -->
    <g class="tarnish-asleep">
      <path d="M38.6 63.6 Q41.6 66 44.6 63.6 M49.4 63.6 Q52.4 66 55.4 63.6" fill="none" stroke-width="1.5"/>
      <ellipse cx="47" cy="71.4" rx="1.8" ry="1.3" fill="#2A1E14" fill-opacity="0.5" stroke="none"/>
    </g>
    <path d="M38.6 49.2 L36.4 42.6 L42.6 47.4 Z" fill="#E8F0FF" stroke-width="1.3"/>
    <path d="M44.6 47.2 L47.6 38.4 L50 46.8 Z" fill="#E8B66A" stroke-width="1.3"/>
    <path d="M52.4 48.2 L57.6 42.4 L56 50.4 Z" fill="#E8F0FF" stroke-width="1.3"/>
  </g>
</svg>
