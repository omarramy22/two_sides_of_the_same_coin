<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" data-palettes="awake,asleep">
  <!-- Chapter 5, The Dark: soot-black coin with ember cracks and smoke -->
  <g filter="url(#wobble)" stroke="#2A1E14" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="48" cy="88" rx="14" ry="3.6" fill="#000" fill-opacity="0.25" stroke="none"/>
    
    <!-- stubby legs -->
    <path d="M40.5 81 L40 86.6 Q42.5 88 44.6 86.6 L44.6 82 Z M50 82 L50 86.6 Q52.2 88 54.4 86.6 L54 81 Z" fill="#342C3E" stroke-width="1.5"/>
