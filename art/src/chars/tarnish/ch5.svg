    <path d="M48 47.5 Q66.5 48 67.5 65.5 Q66.5 83 48 83.5 Z" fill="#342C3E"/>
    <path d="M57 50 L57 81 M60.6 51.8 L60.6 79.4 M63.8 55 L63.8 76.2 M66 59.6 L66 71.6" stroke="#8E80A0" stroke-width="1" stroke-opacity="0.6"/>
    <!-- coin face -->
    <path d="M30.5 65.5 Q30.5 52 38 48.6 Q47 44.6 55.4 49.6 Q63.5 54 63.5 65.5 Q63.2 83 47 83.4 Q30.8 83 30.5 65.5 Z" fill="#62566F"/>
    <path d="M55.6 51 Q61.8 56 61.6 66.5 Q60.8 80 49.5 81.8 Q58 74 57.6 64 Q57.4 56.6 55.6 51 Z" fill="url(#hatch)" stroke="none"/>
    <ellipse cx="47" cy="65.5" rx="13.2" ry="14" fill="none" stroke="#342C3E" stroke-width="1" stroke-dasharray="2 1.6"/>
    <path d="M34.6 74 L38 70.4 L37 66.4 L40.4 63.6 M58.4 75.6 L55.4 72.6 L56.6 68.8 M45 80 L47 77 L49.6 78.6" fill="none" stroke="#FF8A3A" stroke-width="1.6"/>
    <path d="M34.6 74 L38 70.4 L37 66.4 L40.4 63.6 M58.4 75.6 L55.4 72.6 L56.6 68.8 M45 80 L47 77 L49.6 78.6" fill="none" stroke="#FFD08A" stroke-width="0.6"/>
    <!-- awake: brows, glowing eyes, jagged grin -->
    <g class="tarnish-awake">
      <path d="M37.5 57 L44.5 60 M56.5 57 L49.5 60" stroke-width="2.2"/>
      <ellipse cx="41.6" cy="63.4" rx="2.9" ry="3.3" fill="#FF7A3A" stroke-width="1.4"/>
      <ellipse cx="52.4" cy="63.4" rx="2.9" ry="3.3" fill="#FF7A3A" stroke-width="1.4"/>
      <circle cx="42.2" cy="64" r="1.2" fill="#2A1E14" stroke="none"/>
      <circle cx="51.8" cy="64" r="1.2" fill="#2A1E14" stroke="none"/>
      <path d="M41.5 72 L43.5 70.6 L45.5 72.4 L47.5 70.6 L49.5 72.4 L51.5 70.6 L53 72" fill="none" stroke-width="1.4"/>
    </g>
    <!-- asleep: closed eyes, slack mouth -->
    <g class="tarnish-asleep">
      <path d="M38.6 63.6 Q41.6 66 44.6 63.6 M49.4 63.6 Q52.4 66 55.4 63.6" fill="none" stroke-width="1.5"/>
      <ellipse cx="47" cy="71.4" rx="1.8" ry="1.3" fill="#2A1E14" fill-opacity="0.5" stroke="none"/>
    </g>
    <path d="M42 47 Q38.6 42 42 38.6 Q45 36 43 32.6 M50.6 46.6 Q54.6 42.4 51.4 38.4 Q49 35.4 52 32" fill="none" stroke="#8A7E96" stroke-width="2.2" stroke-opacity="0.85"/>
    <path d="M42 47 Q38.6 42 42 38.6 Q45 36 43 32.6 M50.6 46.6 Q54.6 42.4 51.4 38.4 Q49 35.4 52 32" fill="none" stroke="#C8BED2" stroke-width="0.8" stroke-opacity="0.7"/>
  </g>
</svg>
