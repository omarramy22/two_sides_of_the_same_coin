<svg xmlns="http://www.w3.org/2000/svg" width="240" height="360" viewBox="0 0 240 360">
  <!-- The first wisher (side view, facing right): a sun-disc cap like Sol's, a warm cloak, one hand
       held out where the coin leaves it. The game flips the sprite to face left. -->
  <ellipse cx="118" cy="350" rx="62" ry="8" fill="#000" fill-opacity="0.3"/>
  <g filter="url(#wobble)" stroke="var(--sol-ink)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- boots -->
    <path d="M92 318 L92 344 Q92 350 100 350 L116 350 Q120 349 118 344 L112 318 Z" fill="var(--sol-boot)"/>
    <path d="M124 318 L124 344 Q124 350 132 350 L152 350 Q157 348 153 343 L144 318 Z" fill="var(--sol-boot)"/>
    <!-- cloak -->
    <path d="M86 152 Q70 240 64 322 Q118 340 172 322 Q166 240 156 152 Q122 134 86 152 Z" fill="var(--sol-cloak)"/>
    <path d="M128 150 Q148 240 150 330 Q164 328 172 322 Q166 240 156 152 Q142 145 128 150 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M64 316 Q118 334 172 316 L172 324 Q118 342 64 324 Z" fill="var(--gold)" stroke-width="2"/>
    <path d="M68 322 Q118 338 168 322" fill="none" stroke="var(--gold-dark)" stroke-width="1.6" stroke-dasharray="1.4 2.6"/>
    <!-- tunic peeking at the front -->
    <path d="M140 160 Q150 230 154 318 L166 316 Q160 230 152 158 Z" fill="var(--sol-tunic)" stroke-width="2"/>
    <!-- the outstretched arm and hand, palm up, where the coin was -->
    <path d="M140 172 Q170 176 196 190 L190 204 Q164 194 136 196 Z" fill="var(--sol-cloak)"/>
    <path d="M150 190 Q170 194 190 204 L194 196" fill="url(#hatch)" stroke="none"/>
    <path d="M190 190 Q204 186 212 192 Q214 200 204 204 Q196 206 190 204 Z" fill="var(--sol-skin)"/>
    <!-- head -->
    <circle cx="124" cy="106" r="44" fill="var(--sol-skin)"/>
    <path d="M86 92 Q84 132 108 146 Q92 120 96 96 Z" fill="var(--sol-hair)"/>
    <path d="M160 116 Q170 114 168 104" fill="none" stroke-width="2"/>
    <ellipse cx="114" cy="112" rx="7" ry="9" fill="var(--sol-skin-shade)" stroke-width="2"/>
    <!-- eye looking up and out at the coin, a small smile -->
    <ellipse cx="146" cy="100" rx="4" ry="5.5" fill="var(--sol-ink)" stroke="none"/>
    <path d="M140 92 Q147 87 154 91" fill="none" stroke-width="2"/>
    <path d="M146 126 Q154 129 160 124" fill="none" stroke-width="2"/>
    <circle cx="150" cy="116" r="6" fill="var(--blush)" fill-opacity="0.45" stroke="none"/>
    <!-- the coin cap: a dome with a sun stamped on it and a brim forward -->
    <path d="M78 96 Q82 50 126 46 Q166 48 172 90 Q140 80 78 96 Z" fill="var(--gold)"/>
    <path d="M150 86 Q180 84 196 96 Q178 102 152 98 Z" fill="var(--gold)"/>
    <path d="M128 52 Q160 58 170 88 Q146 82 132 84 Z" fill="url(#hatch-fine)" stroke="none"/>
    <circle cx="118" cy="70" r="12" fill="var(--gold-light)" stroke-width="2"/>
    <path d="M118 52 V56 M118 84 V88 M100 70 H104 M132 70 H136 M106 58 L109 61 M127 79 L130 82 M106 82 L109 79 M127 61 L130 58" stroke-width="2"/>
  </g>
  <!-- moonlight on the cap and shoulder -->
  <path d="M92 70 Q104 52 126 50" stroke="#FFF4D6" stroke-opacity="0.7" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M90 160 Q82 210 76 260" stroke="#FFF4D6" stroke-opacity="0.35" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
