<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" data-palettes="heads,tails">
  <!-- Top face -->
  <path d="M 0 0 L 64 0 L 64 44 L 0 44 L 0 0 Z" fill="var(--wall-top)"/>
  <!-- Internal stone block seams -->
  <g filter="url(#wobble-soft)" stroke="var(--wall-shade)" stroke-width="1.2" stroke-opacity="0.75" stroke-linecap="round" fill="none">
    <path d="M 37 0 Q 39 22 36 44"/>
    <path d="M 38 20 Q 51 21 64 20"/>
  </g>
  
    <!-- Front face -->
    <path d="M 0 44 L 64 44 L 64 64 L 6 64 A 6 6 0 0 1 0 58 Z" fill="var(--wall-face)"/>
    <path d="M 0 44 L 64 44 L 64 64 L 6 64 A 6 6 0 0 1 0 58 Z" fill="url(#hatch)" stroke="none"/>
    <line x1="25" y1="44" x2="25" y2="61" stroke="var(--wall-shade)" stroke-width="1.2" stroke-opacity="0.85"/>
    <line x1="43" y1="44" x2="43" y2="61" stroke="var(--wall-shade)" stroke-width="1.2" stroke-opacity="0.85"/>
    <!-- Bottom shade band (3px) -->
    <path d="M 6 61 L 64 61 L 64 64 L 6 64 Z" fill="var(--wall-shade)" stroke="none"/>
    <!-- Ink line between top and front face -->
    <line x1="0" y1="44" x2="64" y2="44" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Open edge highlights -->
  <line x1="2" y1="1" x2="2" y2="42" stroke="var(--highlight)" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Ink outlines along open edges -->
  <g filter="url(#wobble)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M 64 64 L 6 64"/>
    <path d="M 0 58 L 0 0"/>
    <path d="M 6 64 A 6 6 0 0 1 0 58"/>
  </g>
</svg>
