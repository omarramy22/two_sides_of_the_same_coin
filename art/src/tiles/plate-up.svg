<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" data-palettes="heads,tails,heads2,tails2,heads3,tails3,heads4,tails4,heads5,tails5,heads6,tails6">
  <!-- Ground drop shadow -->
  <ellipse cx="32" cy="38" rx="21.5" ry="17.5" fill="#000" fill-opacity="0.28"/>

  <!-- Thin side band of raised stone disc (front face) -->
  <path d="M 12 33 A 20 17 0 0 0 52 33 L 52 36 A 20 17 0 0 1 12 36 Z" fill="var(--wall-face)"/>
  <path d="M 32 36.5 A 20 17 0 0 0 52 33 L 52 36 Z" fill="url(#hatch)" stroke="none"/>
  <g filter="url(#wobble)" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M 12 33 L 12 36 A 20 17 0 0 0 52 36 L 52 33"/>
  </g>

  <!-- Top face of carved stone disc -->
  <ellipse cx="32" cy="33" rx="20" ry="17" fill="var(--wall-top)"/>
  <!-- Shading on bottom-right of top face -->
  <path d="M 22 47.5 A 20 17 0 0 0 52 33 A 19 16 0 0 1 22 47.5 Z" fill="url(#hatch)" stroke="none"/>
  <!-- Top-left rim highlight -->
  <path d="M 14 31 A 18 15 0 0 1 42 17.5" stroke="var(--highlight)" stroke-opacity="0.55" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Engraved coin concentric reeding groove on the stone -->
  <g filter="url(#wobble-soft)" fill="none">
    <ellipse cx="32" cy="33" rx="14.5" ry="12" stroke="var(--wall-shade)" stroke-width="1" stroke-dasharray="1.2 2" stroke-opacity="0.75"/>
    <!-- Ink outline of the disc -->
    <ellipse cx="32" cy="33" rx="20" ry="17" stroke="var(--ink)" stroke-width="1.8"/>
  </g>

  <!-- Central empty socket where link glyph is drawn (radius ~8) -->
  <ellipse cx="32" cy="33" rx="8" ry="6.8" fill="var(--wall-shade)"/>
  <ellipse cx="32" cy="33" rx="8" ry="6.8" fill="url(#hatch-cross)"/>
  <g filter="url(#wobble-soft)" fill="none">
    <ellipse cx="32" cy="33" rx="8" ry="6.8" stroke="var(--ink)" stroke-width="1.4"/>
    <!-- Inner depth shadow along socket top rim -->
    <path d="M 24.5 32.5 A 7.5 6.2 0 0 1 39.5 32.5" stroke="#000" stroke-opacity="0.45" stroke-width="1.3"/>
  </g>

  <!-- Brass rope ring at top edge (centred at x=32) -->
  <!-- Mounting bracket -->
  <g filter="url(#wobble-soft)">
    <path d="M 29.5 17.5 L 34.5 17.5 L 34 13.5 L 30 13.5 Z" fill="var(--gold-dark)" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="32" cy="15.5" r="0.9" fill="var(--ink)"/>
    <!-- Brass ring standing up -->
    <path d="M 32 4.5 C 34.8 4.5 36.8 6.5 36.8 9.5 C 36.8 12.5 34.8 14.5 32 14.5 C 29.2 14.5 27.2 12.5 27.2 9.5 C 27.2 6.5 29.2 4.5 32 4.5 Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Ring hole -->
    <ellipse cx="32" cy="9.5" rx="2.3" ry="2.2" fill="var(--wall-top)" stroke="var(--ink)" stroke-width="1.1"/>
    <!-- Ring shadow and highlight -->
    <path d="M 34.5 7 A 4.5 4.5 0 0 1 36 12" stroke="var(--gold-dark)" stroke-width="1" fill="none"/>
    <path d="M 29.5 7 A 4.5 4.5 0 0 1 32 5.2" stroke="var(--gold-light)" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
</svg>
