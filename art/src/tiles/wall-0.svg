<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" data-palettes="heads,tails">
  <!-- Top face -->
  <path d="M 0 6 A 6 6 0 0 1 6 0 L 58 0 A 6 6 0 0 1 64 6 L 64 44 L 0 44 L 0 6 Z" fill="var(--wall-top)"/>
  <!-- Internal stone block seams -->
  <g filter="url(#wobble-soft)" stroke="var(--wall-shade)" stroke-width="1.2" stroke-opacity="0.75" stroke-linecap="round" fill="none">
    <path d="M 22 0 Q 24 22 21 44"/>
    <path d="M 21 20 Q 11 19 0 20"/>
  </g>
  
    <!-- Front face -->
    <path d="M 0 44 L 64 44 L 64 58 A 6 6 0 0 1 58 64 L 6 64 A 6 6 0 0 1 0 58 Z" fill="var(--wall-face)"/>
    <path d="M 0 44 L 64 44 L 64 58 A 6 6 0 0 1 58 64 L 6 64 A 6 6 0 0 1 0 58 Z" fill="url(#hatch)" stroke="none"/>
    <line x1="20" y1="44" x2="20" y2="61" stroke="var(--wall-shade)" stroke-width="1.2" stroke-opacity="0.85"/>
    <line x1="42" y1="44" x2="42" y2="61" stroke="var(--wall-shade)" stroke-width="1.2" stroke-opacity="0.85"/>
    <!-- Bottom shade band (3px) -->
    <path d="M 6 61 L 58 61 L 58 64 L 6 64 Z" fill="var(--wall-shade)" stroke="none"/>
    <!-- Ink line between top and front face -->
    <line x1="0" y1="44" x2="64" y2="44" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Open edge highlights -->
  <path d="M 2 40 L 2 6 Q 2 2 6 2 L 58 2" fill="none" stroke="var(--highlight)" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Ink outlines along open edges -->
  <g filter="url(#wobble)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M 6 0 L 58 0"/>
    <path d="M 64 6 L 64 58"/>
    <path d="M 58 64 L 6 64"/>
    <path d="M 0 58 L 0 6"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0"/>
    <path d="M 58 0 A 6 6 0 0 1 64 6"/>
    <path d="M 64 58 A 6 6 0 0 1 58 64"/>
    <path d="M 6 64 A 6 6 0 0 1 0 58"/>
  </g>
</svg>
