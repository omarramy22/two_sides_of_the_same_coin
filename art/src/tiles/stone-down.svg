<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" data-palettes="heads,tails,heads2,tails2,heads3,tails3">
  <!-- Dark perimeter gap / pit recess framing the sunken stone -->
  <rect x="8" y="12" width="48" height="42" rx="4" fill="var(--pit)"/>
  <!-- Deep shadow along the upper inner edge of the pit frame -->
  <path d="M 9 16 L 9 13 A 3 3 0 0 1 12 13 L 52 13 A 3 3 0 0 1 55 13 L 55 16" stroke="#000" stroke-opacity="0.75" stroke-width="2" fill="none"/>

  <!-- Sunken Stone Top Face (flush with floor, y: 15 to 51) -->
  <rect x="11" y="15" width="42" height="36" rx="3" fill="var(--wall-top)"/>
  <!-- Shading on bottom-right of sunken stone -->
  <path d="M 33 15 L 50 15 A 3 3 0 0 1 53 18 L 53 48 A 3 3 0 0 1 50 51 L 33 51 Z" fill="url(#hatch)" stroke="none" opacity="0.45"/>

  <!-- Stone top face edge outlines -->
  <g filter="url(#wobble-soft)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <rect x="11" y="15" width="42" height="36" rx="3"/>
  </g>

  <!-- Engraved downward chevron on the top face -->
  <g filter="url(#wobble-soft)">
    <!-- Recessed carved chevron shape -->
    <path d="M 21 27 L 32 38 L 43 27 L 40 24 L 32 33 L 24 24 Z" fill="var(--wall-shade)" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Second inner chevron echo -->
    <path d="M 25 23 L 32 30 L 39 23" fill="none" stroke="var(--wall-shade)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Highlight on upper chevron bevel -->
    <path d="M 24 24 L 32 33 L 40 24" fill="none" stroke="var(--highlight)" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brass rope ring (near top edge of tile, centred at x=32, attached to top edge of sunken stone) -->
  <g filter="url(#wobble-soft)">
    <!-- Mounting bracket attached to stone top edge -->
    <path d="M 29.5 17 L 34.5 17 L 34 13.5 L 30 13.5 Z" fill="var(--gold-dark)" stroke="var(--ink)" stroke-width="1.1" stroke-linejoin="round"/>
    <circle cx="32" cy="15.5" r="0.8" fill="var(--ink)"/>
    <!-- Brass ring pulled taut at top edge -->
    <ellipse cx="32" cy="9.5" rx="4.5" ry="4" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.4"/>
    <ellipse cx="32" cy="9.5" rx="2.3" ry="2" fill="var(--pit)" stroke="var(--ink)" stroke-width="1.0"/>
    <path d="M 29.5 7.5 A 4 3.5 0 0 1 33 6" stroke="var(--gold-light)" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
</svg>
