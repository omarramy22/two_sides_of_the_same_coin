<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" data-palettes="heads,tails,heads2,tails2,heads3,tails3,heads4,tails4,heads5,tails5">
  <!-- Deep ground shadow at base of the raised block -->
  <ellipse cx="34" cy="56" rx="23.5" ry="6" fill="#000" fill-opacity="0.35"/>
  <path d="M 12 54 L 52 54 L 57 59 L 18 60 Z" fill="#000" fill-opacity="0.25"/>

  <!-- Front face of stone block (y: 38 to 54) -->
  <path d="M 10 38 L 54 38 L 54 51 A 3 3 0 0 1 51 54 L 13 54 A 3 3 0 0 1 10 51 Z" fill="var(--wall-face)"/>
  <!-- Hatching on bottom-right of front face -->
  <path d="M 32 38 L 54 38 L 54 51 A 3 3 0 0 1 51 54 L 32 54 Z" fill="url(#hatch)" stroke="none"/>
  <!-- Front face bottom shade band -->
  <path d="M 10 51 L 54 51 L 54 54 L 10 54 Z" fill="var(--wall-shade)"/>
  <!-- Vertical chisel marks on front face -->
  <g filter="url(#wobble-soft)" stroke="var(--wall-shade)" stroke-width="1.1" fill="none">
    <line x1="22" y1="40" x2="22" y2="50"/>
    <line x1="38" y1="40" x2="38" y2="50"/>
  </g>

  <!-- Top face of carved square stone block (y: 10 to 38) -->
  <path d="M 13 10 L 51 10 A 3 3 0 0 1 54 13 L 54 38 L 10 38 L 10 13 A 3 3 0 0 1 13 10 Z" fill="var(--wall-top)"/>
  <!-- Subtle top face right-side shading -->
  <path d="M 44 10 L 51 10 A 3 3 0 0 1 54 13 L 54 38 L 44 38 Z" fill="url(#hatch-fine)" stroke="none" opacity="0.6"/>

  <!-- Engraved downward chevron on top face ("push me down") -->
  <g filter="url(#wobble-soft)">
    <!-- Recessed carved chevron shape -->
    <path d="M 19 19 L 32 31 L 45 19 L 42 16 L 32 26 L 22 16 Z" fill="var(--wall-shade)" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Second inner chevron echo -->
    <path d="M 23 15 L 32 23 L 41 15" fill="none" stroke="var(--wall-shade)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Highlight on upper chevron bevel -->
    <path d="M 22 16 L 32 26 L 42 16" fill="none" stroke="var(--highlight)" stroke-opacity="0.65" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Masonry outlines -->
  <g filter="url(#wobble-soft)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Outer perimeter of block -->
    <path d="M 13 10 L 51 10 A 3 3 0 0 1 54 13 L 54 51 A 3 3 0 0 1 51 54 L 13 54 A 3 3 0 0 1 10 51 L 10 13 A 3 3 0 0 1 13 10 Z"/>
    <!-- Dividing line between top face and front face -->
    <line x1="10" y1="38" x2="54" y2="38"/>
  </g>

  <!-- Lit edge highlights -->
  <path d="M 13 11 L 51 11 M 11 13 L 11 37" stroke="var(--highlight)" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Brass rope ring on top (anchored at top edge, centred at x=32) -->
  <g filter="url(#wobble-soft)">
    <!-- Mounting bracket on stone block -->
    <path d="M 29.5 12 L 34.5 12 L 34 8.5 L 30 8.5 Z" fill="var(--gold-dark)" stroke="var(--ink)" stroke-width="1.1" stroke-linejoin="round"/>
    <circle cx="32" cy="10.5" r="0.8" fill="var(--ink)"/>
    <!-- Brass ring standing up near top edge of tile -->
    <ellipse cx="32" cy="5.5" rx="4.5" ry="4" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.4"/>
    <ellipse cx="32" cy="5.5" rx="2.3" ry="2" fill="var(--wall-top)" stroke="var(--ink)" stroke-width="1.0"/>
    <path d="M 29.5 3.5 A 4 3.5 0 0 1 33 2" stroke="var(--gold-light)" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
</svg>
