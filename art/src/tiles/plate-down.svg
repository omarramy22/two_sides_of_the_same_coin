<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" data-palettes="heads,tails,heads2,tails2,heads3,tails3,heads4,tails4,heads5,tails5">
  <!-- Sunken gap / dark shadow ring around the depressed plate -->
  <ellipse cx="32" cy="35" rx="21.5" ry="18" fill="var(--pit)"/>
  <!-- Deep shadow crevice along top edge of the recession -->
  <path d="M 11 35 A 21 17.5 0 0 1 53 35" stroke="#000" stroke-opacity="0.75" stroke-width="2" fill="none"/>

  <!-- The stone plate sunk flush with floor -->
  <ellipse cx="32" cy="35.5" rx="19.5" ry="16.2" fill="var(--wall-top)"/>
  <!-- Shading on bottom-right -->
  <path d="M 23 49.5 A 19.5 16.2 0 0 0 51.5 35.5 A 18 15 0 0 1 23 49.5 Z" fill="url(#hatch)" stroke="none"/>

  <!-- Engraved concentric groove on the plate -->
  <g filter="url(#wobble-soft)" fill="none">
    <ellipse cx="32" cy="35.5" rx="14" ry="11.5" stroke="var(--wall-shade)" stroke-width="1" stroke-dasharray="1.2 2" stroke-opacity="0.7"/>
    <!-- Ink outline of the plate -->
    <ellipse cx="32" cy="35.5" rx="19.5" ry="16.2" stroke="var(--ink)" stroke-width="1.8"/>
  </g>

  <!-- Soft glow around the socket (var(--highlight) at 60%) -->
  <ellipse cx="32" cy="35.5" rx="11" ry="9.5" fill="var(--highlight)" fill-opacity="0.25"/>
  <!-- Glowing central socket -->
  <ellipse cx="32" cy="35.5" rx="8" ry="6.8" fill="var(--highlight)" fill-opacity="0.6"/>
  <ellipse cx="32" cy="35.5" rx="8" ry="6.8" fill="url(#hatch-fine)" opacity="0.35"/>
  <g filter="url(#wobble-soft)" fill="none">
    <ellipse cx="32" cy="35.5" rx="8" ry="6.8" stroke="var(--highlight)" stroke-width="1.8" stroke-opacity="0.9"/>
    <ellipse cx="32" cy="35.5" rx="8" ry="6.8" stroke="var(--ink)" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <!-- Brass rope ring (anchored to sunken plate at top edge, centred at x=32) -->
  <g filter="url(#wobble-soft)">
    <!-- Mounting bracket -->
    <path d="M 29.5 20 L 34.5 20 L 34 16 L 30 16 Z" fill="var(--gold-dark)" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="32" cy="18" r="0.9" fill="var(--ink)"/>
    <!-- Brass ring standing up -->
    <path d="M 32 7 C 34.8 7 36.8 9 36.8 12 C 36.8 15 34.8 17 32 17 C 29.2 17 27.2 15 27.2 12 C 27.2 9 29.2 7 32 7 Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Ring hole -->
    <ellipse cx="32" cy="12" rx="2.3" ry="2.2" fill="var(--pit)" stroke="var(--ink)" stroke-width="1.1"/>
    <!-- Ring highlight -->
    <path d="M 29.5 9.5 A 4.5 4.5 0 0 1 32 7.6" stroke="var(--gold-light)" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
</svg>
