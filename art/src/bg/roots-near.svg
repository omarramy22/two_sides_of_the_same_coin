<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- Soft glow for drifting bioluminescent spores -->
    <filter id="spore-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- NEAR LAYER: Hanging root tendrils and glowing spores near edges only -->
  <!-- Central ~60% is kept completely empty for the board -->

  <!-- ============================================================== -->
  <!-- TOP-LEFT: Hanging ancient root tendrils (Heads)                -->
  <!-- ============================================================== -->
  <g filter="url(#wobble)" stroke="#2A1E14" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main hanging taproot cluster (x: 100 to 140, y: -10 to 290) -->
    <!-- Segment 1: Upper thick root -->
    <path d="M 102 -10 Q 98 25 106 55 Q 118 60 128 50 Q 124 20 120 -10 Z" fill="#4A3018" stroke-width="1.7"/>
    <path d="M 112 10 Q 115 35 120 50" fill="none" stroke="#2A1E14" stroke-width="1.2"/>
    <path d="M 120 12 L 126 28 L 128 50 L 122 52 Z" fill="url(#hatch)" stroke="none"/>

    <!-- Segment 2: Twisting mid section -->
    <path d="M 106 55 Q 100 95 110 135 Q 122 140 130 125 Q 126 90 128 50 Z" fill="#3D2614" stroke-width="1.7"/>
    <path d="M 114 75 Q 116 108 122 130" fill="none" stroke="#2A1E14" stroke-width="1.2"/>
    <path d="M 122 72 L 128 98 L 130 125 L 124 130 Z" fill="url(#hatch)" stroke="none"/>

    <!-- Segment 3: Tapering lower section -->
    <path d="M 110 135 Q 104 175 112 215 Q 122 218 128 205 Q 126 170 130 125 Z" fill="#4A3018" stroke-width="1.6"/>
    <path d="M 116 155 Q 118 185 122 210" fill="none" stroke="#2A1E14" stroke-width="1.1"/>
    <path d="M 122 150 L 126 182 L 128 205 L 124 210 Z" fill="url(#hatch)" stroke="none"/>

    <!-- Segment 4: Splaying hanging tendril tips -->
    <g fill="#3D2614" stroke="#2A1E14" stroke-width="1.3">
      <path d="M 112 215 Q 102 245 96 278 Q 102 280 108 260 Q 114 240 118 215 Z"/>
      <path d="M 118 215 Q 115 250 114 290 Q 120 292 122 265 Q 124 240 124 210 Z" fill="#5A3A1E"/>
      <path d="M 124 210 Q 130 248 135 295 Q 140 290 136 260 Q 132 235 128 205 Z"/>
    </g>

    <!-- Fine curling rootlet hairs -->
    <g fill="none" stroke="#2A1E14" stroke-width="1.0">
      <path d="M 98 270 Q 90 288 88 305"/>
      <path d="M 105 275 Q 102 295 106 312"/>
      <path d="M 115 285 Q 118 305 115 320"/>
      <path d="M 132 288 Q 138 308 144 322"/>
      <path d="M 138 270 Q 148 290 156 304"/>
    </g>

    <!-- Secondary slender hanging vine root (x ~ 60, y: -10 to 190) -->
    <path d="M 55 -10 Q 48 40 58 90 Q 68 140 60 190 Q 64 192 68 185 Q 75 135 66 85 Q 58 35 65 -10 Z" fill="#5A3A1E" stroke-width="1.4"/>
    <path d="M 60 190 Q 56 215 52 235" fill="none" stroke="#2A1E14" stroke-width="0.9"/>
    <path d="M 64 185 Q 68 210 74 230" fill="none" stroke="#2A1E14" stroke-width="0.9"/>

    <!-- Lit root edge highlights -->
    <path d="M 104 5 Q 100 30 106 55 M 106 70 Q 102 105 110 135 M 110 150 Q 106 185 112 215" fill="none" stroke="#F4EBC8" stroke-width="1.2" stroke-opacity="0.45"/>
  </g>

  <!-- ============================================================== -->
  <!-- TOP-RIGHT: Hanging moonlit root tendrils (Tails)                -->
  <!-- ============================================================== -->
  <g filter="url(#wobble)" stroke="#0B1620" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main hanging taproot cluster (x: 1140 to 1180, y: -10 to 290) -->
    <!-- Segment 1: Upper thick root -->
    <path d="M 1178 -10 Q 1182 25 1174 55 Q 1162 60 1152 50 Q 1156 20 1160 -10 Z" fill="#1B2E34" stroke-width="1.7"/>
    <path d="M 1168 10 Q 1165 35 1160 50" fill="none" stroke="#0B1620" stroke-width="1.2"/>
    <path d="M 1160 12 L 1154 28 L 1152 50 L 1158 52 Z" fill="url(#hatch-r)" stroke="none"/>

    <!-- Segment 2: Twisting mid section -->
    <path d="M 1174 55 Q 1180 95 1170 135 Q 1158 140 1150 125 Q 1154 90 1152 50 Z" fill="#14242A" stroke-width="1.7"/>
    <path d="M 1166 75 Q 1164 108 1158 130" fill="none" stroke="#0B1620" stroke-width="1.2"/>
    <path d="M 1158 72 L 1152 98 L 1150 125 L 1156 130 Z" fill="url(#hatch-r)" stroke="none"/>

    <!-- Segment 3: Tapering lower section -->
    <path d="M 1170 135 Q 1176 175 1168 215 Q 1158 218 1152 205 Q 1154 170 1150 125 Z" fill="#1B2E34" stroke-width="1.6"/>
    <path d="M 1164 155 Q 1162 185 1158 210" fill="none" stroke="#0B1620" stroke-width="1.1"/>
    <path d="M 1158 150 L 1154 182 L 1152 205 L 1156 210 Z" fill="url(#hatch-r)" stroke="none"/>

    <!-- Segment 4: Splaying hanging tendril tips -->
    <g fill="#14242A" stroke="#0B1620" stroke-width="1.3">
      <path d="M 1168 215 Q 1178 245 1184 278 Q 1178 280 1172 260 Q 1166 240 1162 215 Z"/>
      <path d="M 1162 215 Q 1165 250 1166 290 Q 1160 292 1158 265 Q 1156 240 1156 210 Z" fill="#25424A"/>
      <path d="M 1156 210 Q 1150 248 1145 295 Q 1140 290 1144 260 Q 1148 235 1152 205 Z"/>
    </g>

    <!-- Fine curling rootlet hairs -->
    <g fill="none" stroke="#0B1620" stroke-width="1.0">
      <path d="M 1182 270 Q 1190 288 1192 305"/>
      <path d="M 1175 275 Q 1178 295 1174 312"/>
      <path d="M 1165 285 Q 1162 305 1165 320"/>
      <path d="M 1148 288 Q 1142 308 1136 322"/>
      <path d="M 1142 270 Q 1132 290 1124 304"/>
    </g>

    <!-- Secondary slender hanging vine root (x ~ 1220, y: -10 to 190) -->
    <path d="M 1225 -10 Q 1232 40 1222 90 Q 1212 140 1220 190 Q 1216 192 1212 185 Q 1205 135 1214 85 Q 1222 35 1215 -10 Z" fill="#25424A" stroke-width="1.4"/>
    <path d="M 1220 190 Q 1224 215 1228 235" fill="none" stroke="#0B1620" stroke-width="0.9"/>
    <path d="M 1216 185 Q 1212 210 1206 230" fill="none" stroke="#0B1620" stroke-width="0.9"/>

    <!-- Lit root edge highlights -->
    <path d="M 1176 5 Q 1180 30 1174 55 M 1174 70 Q 1178 105 1170 135 M 1170 150 Q 1174 185 1168 215" fill="none" stroke="#DFF5EC" stroke-width="1.2" stroke-opacity="0.45"/>
  </g>

  <!-- ============================================================== -->
  <!-- DRIFTING GLOWING SPORES: Near the edges only                    -->
  <!-- ============================================================== -->
  <!-- Left Side: Warm amber spores (Heads) -->
  <g filter="url(#spore-glow)">
    <!-- Upper-left spore cluster near hanging root -->
    <circle cx="160" cy="95" r="3.2" fill="#FFE08A" fill-opacity="0.45"/>
    <circle cx="160" cy="95" r="1.5" fill="#FFF4D6" fill-opacity="0.85"/>

    <circle cx="210" cy="165" r="2.5" fill="#FFE08A" fill-opacity="0.40"/>
    <circle cx="210" cy="165" r="1.1" fill="#FFF4D6" fill-opacity="0.80"/>

    <circle cx="130" cy="235" r="3.8" fill="#FFB84D" fill-opacity="0.35"/>
    <circle cx="130" cy="235" r="1.8" fill="#FFF4D6" fill-opacity="0.75"/>

    <!-- Mid-left outer edge spores -->
    <circle cx="175" cy="330" r="2.6" fill="#FFE08A" fill-opacity="0.32"/>
    <circle cx="225" cy="410" r="3.4" fill="#FFB84D" fill-opacity="0.30"/>
    <circle cx="140" cy="505" r="2.2" fill="#FFE08A" fill-opacity="0.30"/>

    <!-- Lower-left corner spores -->
    <circle cx="195" cy="580" r="3.6" fill="#FFB84D" fill-opacity="0.38"/>
    <circle cx="195" cy="580" r="1.6" fill="#FFF4D6" fill-opacity="0.80"/>
    <circle cx="110" cy="625" r="2.4" fill="#FFE08A" fill-opacity="0.28"/>
  </g>

  <!-- Right Side: Mint glow spores (Tails) -->
  <g filter="url(#spore-glow)">
    <!-- Upper-right spore cluster near hanging root -->
    <circle cx="1120" cy="95" r="3.2" fill="#7FC8A9" fill-opacity="0.42"/>
    <circle cx="1120" cy="95" r="1.5" fill="#DFF5EC" fill-opacity="0.85"/>

    <circle cx="1070" cy="165" r="2.5" fill="#7FC8A9" fill-opacity="0.38"/>
    <circle cx="1070" cy="165" r="1.1" fill="#DFF5EC" fill-opacity="0.80"/>

    <circle cx="1150" cy="235" r="3.8" fill="#4FA08A" fill-opacity="0.35"/>
    <circle cx="1150" cy="235" r="1.8" fill="#DFF5EC" fill-opacity="0.75"/>

    <!-- Mid-right outer edge spores -->
    <circle cx="1105" cy="330" r="2.6" fill="#7FC8A9" fill-opacity="0.30"/>
    <circle cx="1055" cy="410" r="3.4" fill="#4FA08A" fill-opacity="0.28"/>
    <circle cx="1140" cy="505" r="2.2" fill="#7FC8A9" fill-opacity="0.28"/>

    <!-- Lower-right corner spores -->
    <circle cx="1085" cy="580" r="3.6" fill="#7FC8A9" fill-opacity="0.36"/>
    <circle cx="1085" cy="580" r="1.6" fill="#DFF5EC" fill-opacity="0.80"/>
    <circle cx="1170" cy="625" r="2.4" fill="#4FA08A" fill-opacity="0.25"/>
  </g>
</svg>
