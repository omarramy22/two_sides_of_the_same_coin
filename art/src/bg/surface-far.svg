<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- Deep well radial gradient: warm/cool stone rim fading down to pitch abyss -->
    <radialGradient id="shaft-abyss" cx="50%" cy="50%" r="55%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0E1028"/>
      <stop offset="35%" stop-color="#141733"/>
      <stop offset="60%" stop-color="#1B203E"/>
      <stop offset="85%" stop-color="#262338"/>
      <stop offset="100%" stop-color="#342B3A"/>
    </radialGradient>

    <!-- Warm gold ambient glow for the left side (Heads world) -->
    <radialGradient id="warm-ambient" cx="25%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#E8B66A" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#C8643B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8A4B22" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool silver/indigo ambient glow for the right side (Tails world) -->
    <radialGradient id="cool-ambient" cx="75%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#C9D3E6" stop-opacity="0.13"/>
      <stop offset="45%" stop-color="#2E3570" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0E1028" stop-opacity="0"/>
    </radialGradient>

    <!-- Coin tiny glint glow -->
    <radialGradient id="glint-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D6" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#E8B66A" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#C9D3E6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0E1028" stop-opacity="0"/>
    </radialGradient>

    <!-- Left/right half clipping masks -->
    <clipPath id="clip-left">
      <rect x="0" y="0" width="640" height="720"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="640" y="0" width="640" height="720"/>
    </clipPath>
  </defs>

  <!-- Base deep shaft background -->
  <rect width="1280" height="720" fill="url(#shaft-abyss)"/>

  <!-- Left half subtle warm gold tint -->
  <rect x="0" y="0" width="640" height="720" fill="url(#warm-ambient)"/>

  <!-- Right half subtle cool indigo/silver tint -->
  <rect x="640" y="0" width="640" height="720" fill="url(#cool-ambient)"/>

  <!-- Paper/metal subtle grain texture overlay over deep space -->
  <rect width="1280" height="720" fill="#000" fill-opacity="0.04" filter="url(#grain)"/>

  <!-- Faint concentric masonry courses receding into the depths -->
  <!-- Layer 1: Outermost courses (closest to rim, broad and soft) -->
  <g filter="url(#wobble-soft)">
    <!-- Warm side courses (left) -->
    <g clip-path="url(#clip-left)" stroke="#A8742A" stroke-opacity="0.32" fill="none" stroke-linecap="round">
      <ellipse cx="640" cy="360" rx="630" ry="355" stroke-width="1.6"/>
      <ellipse cx="640" cy="360" rx="555" ry="312" stroke-width="1.5"/>
      <ellipse cx="640" cy="360" rx="485" ry="272" stroke-width="1.4"/>
      <ellipse cx="640" cy="360" rx="420" ry="235" stroke-width="1.3"/>
      <ellipse cx="640" cy="360" rx="360" ry="202" stroke-width="1.2"/>
      <ellipse cx="640" cy="360" rx="305" ry="171" stroke-width="1.1"/>
      <ellipse cx="640" cy="360" rx="255" ry="143" stroke-width="1.0"/>
      <ellipse cx="640" cy="360" rx="210" ry="118" stroke-width="0.9"/>
      <ellipse cx="640" cy="360" rx="170" ry="95" stroke-width="0.8"/>
      <ellipse cx="640" cy="360" rx="135" ry="76" stroke-width="0.8"/>
      <ellipse cx="640" cy="360" rx="102" ry="57" stroke-width="0.7"/>
      <ellipse cx="640" cy="360" rx="72" ry="40" stroke-width="0.6"/>
      <ellipse cx="640" cy="360" rx="45" ry="25" stroke-width="0.5"/>

      <!-- Vertical stone joints along concentric courses (left half) -->
      <path d="
        M 85 360 L 10 360
        M 155 360 L 85 360
        M 220 360 L 155 360
        M 280 360 L 220 360
        M 335 360 L 280 360
        M 385 360 L 335 360
        M 430 360 L 385 360
        M 470 360 L 430 360
        M 505 360 L 470 360
        M 538 360 L 505 360
        M 568 360 L 538 360
        M 595 360 L 568 360
        M 165 240 L 110 215
        M 245 230 L 190 205
        M 320 225 L 270 200
        M 385 230 L 340 210
        M 445 240 L 405 225
        M 500 255 L 465 242
        M 548 275 L 520 262
        M 588 300 L 566 288
        M 165 480 L 110 505
        M 245 490 L 190 515
        M 320 495 L 270 520
        M 385 490 L 340 510
        M 445 480 L 405 495
        M 500 465 L 465 478
        M 548 445 L 520 458
        M 588 420 L 566 432
        M 325 105 L 290 60
        M 425 125 L 395 85
        M 505 155 L 485 118
        M 565 192 L 550 160
        M 325 615 L 290 660
        M 425 595 L 395 635
        M 505 565 L 485 602
        M 565 528 L 550 560
      " stroke-width="0.9" stroke-opacity="0.22"/>
    </g>

    <!-- Cool side courses (right) -->
    <g clip-path="url(#clip-right)" stroke="#7F8BB0" stroke-opacity="0.32" fill="none" stroke-linecap="round">
      <ellipse cx="640" cy="360" rx="630" ry="355" stroke-width="1.6"/>
      <ellipse cx="640" cy="360" rx="555" ry="312" stroke-width="1.5"/>
      <ellipse cx="640" cy="360" rx="485" ry="272" stroke-width="1.4"/>
      <ellipse cx="640" cy="360" rx="420" ry="235" stroke-width="1.3"/>
      <ellipse cx="640" cy="360" rx="360" ry="202" stroke-width="1.2"/>
      <ellipse cx="640" cy="360" rx="305" ry="171" stroke-width="1.1"/>
      <ellipse cx="640" cy="360" rx="255" ry="143" stroke-width="1.0"/>
      <ellipse cx="640" cy="360" rx="210" ry="118" stroke-width="0.9"/>
      <ellipse cx="640" cy="360" rx="170" ry="95" stroke-width="0.8"/>
      <ellipse cx="640" cy="360" rx="135" ry="76" stroke-width="0.8"/>
      <ellipse cx="640" cy="360" rx="102" ry="57" stroke-width="0.7"/>
      <ellipse cx="640" cy="360" rx="72" ry="40" stroke-width="0.6"/>
      <ellipse cx="640" cy="360" rx="45" ry="25" stroke-width="0.5"/>

      <!-- Vertical stone joints along concentric courses (right half) -->
      <path d="
        M 1195 360 L 1270 360
        M 1125 360 L 1195 360
        M 1060 360 L 1125 360
        M 1000 360 L 1060 360
        M 945 360 L 1000 360
        M 895 360 L 945 360
        M 850 360 L 895 360
        M 810 360 L 850 360
        M 775 360 L 810 360
        M 742 360 L 775 360
        M 712 360 L 742 360
        M 685 360 L 712 360
        M 1115 240 L 1170 215
        M 1035 230 L 1090 205
        M 960 225 L 1010 200
        M 895 230 L 940 210
        M 835 240 L 875 225
        M 780 255 L 815 242
        M 732 275 L 760 262
        M 692 300 L 714 288
        M 1115 480 L 1170 505
        M 1035 490 L 1090 515
        M 960 495 L 1010 520
        M 895 490 L 940 510
        M 835 480 L 875 495
        M 780 465 L 815 478
        M 732 445 L 760 458
        M 692 420 L 714 432
        M 955 105 L 990 60
        M 855 125 L 885 85
        M 775 155 L 795 118
        M 715 192 L 730 160
        M 955 615 L 990 660
        M 855 595 L 885 635
        M 775 565 L 795 602
        M 715 528 L 730 560
      " stroke-width="0.9" stroke-opacity="0.22"/>
    </g>
  </g>

  <!-- Faint depth shadow hatch bands stepping into the well -->
  <g fill="none">
    <!-- Shading band at lower-right quadrants (light from top-left) -->
    <path d="M 640 436 A 210 118 0 0 1 850 360 A 255 143 0 0 0 640 503 Z" fill="url(#hatch)" stroke="none" opacity="0.35"/>
    <path d="M 640 503 A 255 143 0 0 1 895 360 A 305 171 0 0 0 640 531 Z" fill="url(#hatch)" stroke="none" opacity="0.3"/>
    <path d="M 640 531 A 305 171 0 0 1 945 360 A 360 202 0 0 0 640 562 Z" fill="url(#hatch)" stroke="none" opacity="0.25"/>
    <!-- Subtle cool rim hatch at lower-left (rim light from top-right) -->
    <path d="M 640 436 A 210 118 0 0 0 430 360 A 255 143 0 0 1 640 503 Z" fill="url(#hatch-r)" stroke="none" opacity="0.3"/>
  </g>

  <!-- Central dark void (well bottom pool of shadows) -->
  <ellipse cx="640" cy="360" rx="36" ry="20" fill="#0E1028"/>
  <ellipse cx="640" cy="360" rx="20" ry="11" fill="#070814"/>

  <!-- Subtle split line down the center seam, whispering the two halves -->
  <line x1="640" y1="20" x2="640" y2="340" stroke="#C9D3E6" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="640" y1="380" x2="640" y2="700" stroke="#C9D3E6" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- The single tiny glint of a coin far down at the centre -->
  <g id="coin-glint">
    <!-- Soft aura -->
    <circle cx="640" cy="360" r="16" fill="url(#glint-glow)"/>
    <circle cx="640" cy="360" r="6" fill="#FFF4D6" fill-opacity="0.7"/>

    <!-- Tiny two-sided coin: 7px wide, 4.5px high -->
    <!-- Left half: gold -->
    <path d="M 640 357.8 A 3.6 2.3 0 0 0 640 362.2 Z" fill="var(--gold, #E8B66A)"/>
    <!-- Right half: silver -->
    <path d="M 640 357.8 A 3.6 2.3 0 0 1 640 362.2 Z" fill="var(--silver-light, #E8F0FF)"/>

    <!-- Glint diamond / 4-point star -->
    <polygon points="640,351 641.4,358.8 649,360 641.4,361.2 640,369 638.6,361.2 631,360 638.6,358.8" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Diagonal micro-rays -->
    <line x1="635" y1="355" x2="645" y2="365" stroke="#FFF4D6" stroke-width="0.8" stroke-opacity="0.75"/>
    <line x1="645" y1="355" x2="635" y2="365" stroke="#E8F0FF" stroke-width="0.8" stroke-opacity="0.75"/>
  </g>
</svg>
