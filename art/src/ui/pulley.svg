<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Outer rim flange and rope groove -->
  <circle cx="16" cy="16" r="15" fill="var(--gold-dark, #A8742A)"/>
  <!-- Rope groove channel (deep recessed brass ring) -->
  <circle cx="16" cy="16" r="14" fill="#6E4A24"/>
  <circle cx="16" cy="16" r="14" fill="url(#hatch-fine)" opacity="0.5"/>
  <!-- Inner rim lip -->
  <circle cx="16" cy="16" r="11.5" fill="var(--gold, #E8B66A)"/>

  <!-- Wheel cutouts (open air between the 6 spokes, from r=4.5 to r=10.5) -->
  <!-- We draw the 6 spokes radiating from hub to inner rim -->
  <g id="spokes">
    <!-- Base transparent wheel opening -->
    <circle cx="16" cy="16" r="10.5" fill="none"/>

    <!-- 6 sturdy brass spokes at 60 degree intervals -->
    <!-- 0 deg (vertical up/down) -->
    <g transform="rotate(0 16 16)">
      <rect x="14.8" y="5.5" width="2.4" height="6" rx="0.6" fill="var(--gold, #E8B66A)" stroke="#2A1E14" stroke-width="1.1"/>
      <rect x="14.8" y="20.5" width="2.4" height="6" rx="0.6" fill="var(--gold-dark, #A8742A)" stroke="#2A1E14" stroke-width="1.1"/>
    </g>
    <!-- 60 deg -->
    <g transform="rotate(60 16 16)">
      <rect x="14.8" y="5.5" width="2.4" height="6" rx="0.6" fill="var(--gold, #E8B66A)" stroke="#2A1E14" stroke-width="1.1"/>
      <rect x="14.8" y="20.5" width="2.4" height="6" rx="0.6" fill="var(--gold-dark, #A8742A)" stroke="#2A1E14" stroke-width="1.1"/>
    </g>
    <!-- 120 deg -->
    <g transform="rotate(120 16 16)">
      <rect x="14.8" y="5.5" width="2.4" height="6" rx="0.6" fill="var(--gold, #E8B66A)" stroke="#2A1E14" stroke-width="1.1"/>
      <rect x="14.8" y="20.5" width="2.4" height="6" rx="0.6" fill="var(--gold-dark, #A8742A)" stroke="#2A1E14" stroke-width="1.1"/>
    </g>
  </g>

  <!-- Central brass hub -->
  <circle cx="16" cy="16" r="4.8" fill="var(--gold, #E8B66A)"/>
  <circle cx="16" cy="16" r="4.8" fill="url(#hatch-fine)" opacity="0.35"/>

  <!-- Dark central axle and pin -->
  <circle cx="16" cy="16" r="2.5" fill="#2A1E14"/>
  <circle cx="15.2" cy="15.2" r="0.8" fill="#FFF4D6" fill-opacity="0.8"/>

  <!-- Linework and engraved rim detail -->
  <g filter="url(#wobble-soft)" fill="none" stroke-linecap="round">
    <!-- Outer pulley edge -->
    <circle cx="16" cy="16" r="15" stroke="#2A1E14" stroke-width="1.6"/>
    <!-- Outer groove lip -->
    <circle cx="16" cy="16" r="13" stroke="#2A1E14" stroke-width="1.0" stroke-opacity="0.7"/>
    <!-- Inner rim line -->
    <circle cx="16" cy="16" r="10.5" stroke="#2A1E14" stroke-width="1.3"/>
    <!-- Hub outline -->
    <circle cx="16" cy="16" r="4.8" stroke="#2A1E14" stroke-width="1.3"/>
  </g>

  <!-- Metallic highlights on rim and upper spokes -->
  <path d="M 5.5 12 A 15 15 0 0 1 20 1.2" stroke="var(--gold-light, #FFF4D6)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 8.5 13 A 10.5 10.5 0 0 1 18 5.8" stroke="var(--gold-light, #FFF4D6)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
</svg>
