<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Link Glyph 6: Cross ✚ (Centered, bold engraved gold shape) -->
  <!-- Base cross body -->
  <path d="M 9 3 L 15 3 L 15 9 L 21 9 L 21 15 L 15 15 L 15 21 L 9 21 L 9 15 L 3 15 L 3 9 L 9 9 Z" fill="var(--gold, #E8B66A)"/>

  <!-- Shaded facets on bottom and right arms -->
  <!-- Right arm bottom-half bevel -->
  <polygon points="12,12 21,9 21,15 15,15" fill="var(--gold-dark, #A8742A)"/>
  <!-- Bottom arm right-half bevel -->
  <polygon points="12,12 15,15 15,21 9,21" fill="var(--gold-dark, #A8742A)"/>
  <polygon points="12,12 15,15 15,21 9,21" fill="url(#hatch-fine)" opacity="0.35"/>
  <polygon points="12,12 21,9 21,15 15,15" fill="url(#hatch-fine)" opacity="0.35"/>

  <!-- Center bevel cross-spines -->
  <line x1="9" y1="9" x2="15" y2="15" stroke="var(--gold-dark, #A8742A)" stroke-width="1.0"/>
  <line x1="15" y1="9" x2="9" y2="15" stroke="var(--gold-dark, #A8742A)" stroke-width="1.0"/>
  <line x1="12" y1="3" x2="12" y2="21" stroke="var(--gold-dark, #A8742A)" stroke-width="0.8"/>
  <line x1="3" y1="12" x2="21" y2="12" stroke="var(--gold-dark, #A8742A)" stroke-width="0.8"/>

  <!-- Lit edge highlights on top and left rims -->
  <path d="M 9.5 3.5 L 14.5 3.5 M 3.5 9.5 L 3.5 14.5 M 3.5 9.5 L 8.5 9.5 M 9.5 3.5 L 9.5 8.5" stroke="var(--gold-light, #FFF4D6)" stroke-width="1.0" stroke-linecap="round" fill="none"/>

  <!-- Ink outline with subtle wobble -->
  <g filter="url(#wobble-soft)">
    <path d="M 9 3 L 15 3 L 15 9 L 21 9 L 21 15 L 15 15 L 15 21 L 9 21 L 9 15 L 3 15 L 3 9 L 9 9 Z" fill="none" stroke="#2A1E14" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
